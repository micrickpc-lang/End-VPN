name: endvpn
description: End VPN - Premium VPN client
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^10.3.1
  device_info_plus: ^13.2.0
  crypto: ^3.0.3
  logger: ^2.4.0
  intl: ^0.20.3
  url_launcher: ^6.3.0
  flutter_singbox_vpn: ^1.1.2
  shared_preferences: ^2.5.0
  yaml: ^3.1.2
  yandex_mobileads: 7.18.0

dependency_overrides:
  flutter_singbox_vpn:
    path: packages/flutter_singbox_vpn
  shared_preferences_android:
    path: packages/shared_preferences_android
  yandex_mobileads:
    path: packages/yandex_mobileads

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  shaders:
    - shaders/liquid_glass.frag
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700

